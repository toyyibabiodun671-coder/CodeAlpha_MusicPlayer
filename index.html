<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="player">
  <div class="art-wrap">
    <div class="disc" id="disc">
      <img id="cover" src="" alt="Album cover">
    </div>
  </div>

  <div class="track-info">
    <h1 id="trackTitle">—</h1>
    <p id="trackArtist">—</p>
  </div>

  <div class="progress-row">
    <span class="time" id="currentTime">0:00</span>
    <input type="range" id="seek" class="seek" min="0" max="100" value="0" step="0.1">
    <span class="time" id="duration">0:00</span>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" aria-label="Previous">
      <svg viewBox="0 0 24 24"><path d="M6 5v14M18 5L8 12l10 7V5z" fill="currentColor"/></svg>
    </button>
    <button class="ctrl-btn play" id="playBtn" aria-label="Play">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M7 4l14 8-14 8V4z" fill="currentColor"/></svg>
    </button>
    <button class="ctrl-btn" id="nextBtn" aria-label="Next">
      <svg viewBox="0 0 24 24"><path d="M18 5v14M6 5l10 7-10 7V5z" fill="currentColor"/></svg>
    </button>
  </div>

  <div class="volume-row">
    <svg class="vol-icon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M17 9a4 4 0 010 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input type="range" id="volume" class="volume" min="0" max="100" value="70">
  </div>

  <audio id="audio"></audio>
</main>

<p class="footnote">Built with HTML, CSS &amp; JavaScript — CodeAlpha Frontend Internship, Task 4</p>

<script src="script.js"></script>
</body>
</html>
